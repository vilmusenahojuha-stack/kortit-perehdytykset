<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <title>Kortit ja perehdytykset</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Kortit ja perehdytykset</h1>
      <p id="subtitle">Kirjaudu PIN-koodilla</p>
    </div>
    <button id="logoutBtn" class="btn ghost hidden" type="button">Kirjaudu ulos</button>
  </header>

  <main>
    <section id="loginView" class="panel narrow">
      <h2>Kirjautuminen</h2>
      <p class="muted">Syötä henkilökohtainen PIN-koodisi.</p>
      <label>PIN-koodi
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-describedby="loginMessage">
      </label>
      <button id="loginBtn" class="btn primary wide" type="button">KIRJAUDU</button>
      <p id="loginMessage" class="message" role="status"></p>
    </section>

    <section id="appView" class="hidden">
      <div id="connectionBanner" class="banner hidden"></div>

      <section id="adminTools" class="panel hidden">
        <div class="row between wrap">
          <div>
            <h2>Ylläpitäjän näkymä</h2>
            <p class="muted">Näet ja voit muokata kaikkien tietoja.</p>
          </div>
          <label class="compact">Työntekijä
            <select id="userFilter"></select>
          </label>
        </div>
      </section>

      <section class="summary-grid" aria-label="Tilanne">
        <button class="summary ok" data-filter="valid" type="button"><strong id="validCount">0</strong><span>Voimassa</span></button>
        <button class="summary warn" data-filter="warning" type="button"><strong id="warningCount">0</strong><span>Vanhenee pian</span></button>
        <button class="summary danger" data-filter="expired" type="button"><strong id="expiredCount">0</strong><span>Vanhentunut</span></button>
      </section>

      <section class="panel">
        <div class="row between wrap gap">
          <div class="segmented" aria-label="Näytettävä tyyppi">
            <button class="seg active" data-type-filter="all" type="button">Kaikki</button>
            <button class="seg" data-type-filter="card" type="button">Kortit</button>
            <button class="seg" data-type-filter="orientation" type="button">Perehdytykset</button>
          </div>
          <button id="addBtn" class="btn primary" type="button">+ LISÄÄ UUSI</button>
        </div>
        <p id="listHint" class="muted"></p>
        <div id="recordList" class="record-list"></div>
      </section>
    </section>
  </main>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <div class="dialog-head">
        <h2 id="dialogTitle">Lisää uusi</h2>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="Sulje">×</button>
      </div>

      <label id="ownerField" class="hidden">Työntekijä
        <select id="ownerInput"></select>
      </label>

      <label>Tyyppi
        <select id="typeInput" required>
          <option value="card">Kortti</option>
          <option value="orientation">Perehdytys</option>
        </select>
      </label>

      <label>Nimi
        <input id="nameInput" type="text" maxlength="100" required placeholder="Esim. Työturvakortti">
      </label>

      <fieldset>
        <legend>Suoritettu</legend>
        <div class="date-parts">
          <label>Päivä <input id="completedDay" type="number" inputmode="numeric" min="1" max="31" placeholder="–"></label>
          <label>Kuukausi <input id="completedMonth" type="number" inputmode="numeric" min="1" max="12" required placeholder="kk"></label>
          <label>Vuosi <input id="completedYear" type="number" inputmode="numeric" min="2000" max="2199" required placeholder="vvvv"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Vanhenee</legend>
        <div class="date-parts">
          <label>Päivä <input id="expiresDay" type="number" inputmode="numeric" min="1" max="31" placeholder="–"></label>
          <label>Kuukausi <input id="expiresMonth" type="number" inputmode="numeric" min="1" max="12" required placeholder="kk"></label>
          <label>Vuosi <input id="expiresYear" type="number" inputmode="numeric" min="2000" max="2199" required placeholder="vvvv"></label>
        </div>
        <p class="help">Jos päivä jätetään tyhjäksi, voimassaolo päättyy kuukauden viimeisenä päivänä.</p>
      </fieldset>

      <label>Lisätiedot (valinnainen)
        <textarea id="notesInput" rows="3" maxlength="500"></textarea>
      </label>

      <p id="formMessage" class="message" role="status"></p>
      <div class="dialog-actions">
        <button id="deleteBtn" class="btn danger-btn hidden" type="button">POISTA</button>
        <span class="spacer"></span>
        <button id="cancelBtn" class="btn ghost" type="button">PERUUTA</button>
        <button id="saveBtn" class="btn primary" type="submit">TALLENNA</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app-v3.js"></script>
</body>
</html>
